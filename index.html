<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Baseball 4 United - Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
     /* Base / layout */
    html {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      color: #f0f4ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;

      background: radial-gradient(ellipse at bottom, #0b1026 0%, #020205 100%);
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background-image:
        radial-gradient(1px 1px at 10% 10%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 20% 30%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 35% 60%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 50% 20%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 65% 40%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 80% 10%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 90% 70%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 15% 80%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 45% 90%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 75% 85%, #fff, rgba(255,255,255,0));
      background-size: 200px 200px;
      background-repeat: repeat;
      opacity: 0.7;

      animation: twinkle 3s ease-in-out infinite;
    }

    body::after {
      background-image:
        radial-gradient(1.5px 1.5px at 25% 25%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 55% 35%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 85% 55%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 35% 75%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 65% 15%, #fff, rgba(255,255,255,0));
      background-size: 300px 300px;
      background-repeat: repeat;
      opacity: 0.4;

      animation: twinkle 8s ease-in-out infinite reverse;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.45;
        filter: brightness(0.9);
      }
      50% {
        opacity: 0.8;
        filter: brightness(1.2);
      }
    }

    header {
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      padding: 2rem 1rem;
      position: relative;
      z-index: 1;
      background: rgba(0, 0, 0, 0.55);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    h1 {
      margin: 0;
      font-size: 2.2rem;
      color: white;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    }

    main {
      width: min(900px, calc(100% - 2rem));
      box-sizing: border-box;
      padding: 2rem 0;
      position: relative;
      z-index: 1;
      text-align: center;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
    }

    .registration-box {
      max-width: 420px;
      margin: 2rem auto;
      padding: 1.5rem;
      text-align: left;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.55);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .registration-box h2 {
      margin-top: 0;
      text-align: center;
      color: white;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.7rem;
      margin-bottom: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      font-size: 1rem;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 6px;
      padding: 0.75rem;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #4f6dff, #8a5cff);
    }

    #registrationMessage {
      min-height: 1.5rem;
      margin-bottom: 0;
      text-align: center;
      color: #cfd6ff;
    }

    .admin-link {
      display: block;
      text-align: center;
      color: #cfd6ff;
      text-decoration: none;
    }

    footer {
      position: relative;
      z-index: 1;
      margin-top: auto;
      padding: 1rem;
      color: #cfd6ff;
      text-align: center;
    }
  </style>
</head>

<body>
  <header>
    <h1>Baseball4United</h1>
  </header>

  <main>
    <img
      src="baseball4united.jpeg"
      alt="https://media.gettyimages.com/id/109439278/photo/usa-california-little-league-baseball-team-during-baseball-match.webp?s=1024x1024&w=gi&k=20&c=u1MmJ_ICJo9QUvF4k67eA3nlGsIs-iZ-5QmsoeR0sWY"
    >

    <section class="registration-box">
      <h2>Join the team</h2>

      <form id="registrationForm">
        <label for="name">Name</label>
        <input type="text" id="name" required>

        <label for="phone">Phone number</label>
        <input type="tel" id="phone" required>

        <button type="submit">Register</button>

        <p id="registrationMessage" aria-live="polite"></p>
      </form>
    </section>

    <a href="userslogin.html">View teams</a>
    <a class="admin-link" href="login.html">Admin login</a>
  </main>

  <footer>
    Hit the ball and run for your joy before someone catches you.
  </footer>

  <script src="list.js"></script>
</body>
</html>
