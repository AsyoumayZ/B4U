<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Baseball4United - Registrations</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      color: #f0f4ff;
      background: radial-gradient(
        ellipse at bottom,
        #0b1026 0%,
        #020205 100%
      );
    }

    header {
      padding: 2rem 1rem;
      text-align: center;
      background: rgba(0, 0, 0, 0.55);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    h1 {
      margin: 0;
    }

    main {
      width: min(800px, calc(100% - 2rem));
      margin: 2rem auto;
    }

    .list-box {
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.55);
    }

    #registrationList {
      padding: 0;
      margin: 0;
      list-style: none;
    }

    #registrationList li {
      padding: 1rem;
      margin-top: 0.75rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
    }

    .person-name {
      display: block;
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
    }

    .phone {
      display: block;
      margin-top: 0.25rem;
      color: #cfd6ff;
    }

    .date {
      display: block;
      margin-top: 0.25rem;
      color: #aeb8e6;
      font-size: 0.85rem;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    button,
    a {
      border: none;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      color: white;
      background: linear-gradient(135deg, #4f6dff, #8a5cff);
      text-decoration: none;
      font: inherit;
      cursor: pointer;
    }

    button:hover,
    a:hover {
      filter: brightness(1.12);
    }

    #clearRegistrationsButton,
    .delete-registration {
      background: linear-gradient(135deg, #d93838, #a51f35);
    }

    .delete-registration {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.5rem 0.8rem;
      font-size: 0.9rem;
    }

    #clearRegistrationsButton:hover,
    .delete-registration:hover {
      filter: brightness(1.12);
    }
  </style>
</head>

<body>
  <header>
    <h1>All registrations</h1>
  </header>

  <main>
    <section class="list-box">
      <h2>Team list</h2>

      <ul id="registrationList"></ul>

      <div class="buttons">
        <a href="index.html">Registration page</a>

        <button id="clearRegistrationsButton" type="button">
          Clear all registrations
        </button>

        <a href="Team.html">Teams</a>

        <button id="logoutButton" type="button">
          Log out
        </button>
      </div>
    </section>
  </main>

  <script src="show.js"></script>
</body>
</html>
