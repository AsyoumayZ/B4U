<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Baseball4United - Admin Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
 /* Base / layout */
    html {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      color: #f0f4ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;

      background: radial-gradient(ellipse at bottom, #0b1026 0%, #020205 100%);
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background-image:
        radial-gradient(1px 1px at 10% 10%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 20% 30%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 35% 60%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 50% 20%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 65% 40%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 80% 10%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 90% 70%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 15% 80%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 45% 90%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 75% 85%, #fff, rgba(255,255,255,0));
      background-size: 200px 200px;
      background-repeat: repeat;
      opacity: 0.7;

      animation: twinkle 3s ease-in-out infinite;
    }

    body::after {
      background-image:
        radial-gradient(1.5px 1.5px at 25% 25%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 55% 35%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 85% 55%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 35% 75%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 65% 15%, #fff, rgba(255,255,255,0));
      background-size: 300px 300px;
      background-repeat: repeat;
      opacity: 0.4;

      animation: twinkle 8s ease-in-out infinite reverse;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.45;
        filter: brightness(0.9);
      }
      50% {
        opacity: 0.8;
        filter: brightness(1.2);
      }
    }

    .login-box {
      width: min(360px, calc(100% - 3rem));
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.55);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    label {
      display: block;
      margin: 1rem 0 0.4rem;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 0.7rem;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      font-size: 1rem;
    }

    button {
      width: 100%;
      margin-top: 1rem;
      border: none;
      border-radius: 6px;
      padding: 0.75rem;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #4f6dff, #8a5cff);
    }

    .error {
      min-height: 1.5rem;
      margin: 1rem 0 0;
      color: #ffb3b3;
      text-align: center;
    }

    a {
      display: block;
      margin-top: 1rem;
      color: #cfd6ff;
      text-align: center;
    }

.password-wrapper {
  position: relative;
  width: 100%;
}

.password-wrapper input {
  box-sizing: border-box;
  width: 100%;
  padding-right: 50px;
}

.toggle-password {
  position: absolute;
  top: 15%;
  right: 12px;
  transform: translateY(-50%);

  display: flex;
  align-items: center;
  justify-content: center;

  width: 32px;
  height: 32px;
  padding: 0;

  color: white;
  background: transparent;
  border: none;
  cursor: pointer;
}


  </style>
</head>

<body>
  <main class="login-box">
    <h1>Admin login</h1>

    <form id="loginForm">
  <label for="username">Username</label>
  <input
    type="text"
    id="username"
    autocomplete="username"
    required
  >

  <label for="password">Password</label>

<div class="password-wrapper">
  <input
    type="password"
    id="password"
    autocomplete="current-password"
    required
  >

  <button
    type="button"
    id="togglePassword"
    class="toggle-password"
    aria-label="Show password"
  >
    👁️
  </button>
</div>

    <script>
          const passwordInput = document.getElementById("password");
			 const togglePassword = document.getElementById("togglePassword");

	togglePassword.addEventListener("click", () => {
  const isHidden = passwordInput.type === "password";

  passwordInput.type = isHidden ? "text" : "password";
  togglePassword.textContent = isHidden ? "🙈" : "👁️";
  togglePassword.setAttribute(
    "aria-label",
    isHidden ? "Hide password" : "Show password"
  );
});

        </script>
  <button type="submit">Log in</button>

  <p id="errorMsg" class="error" aria-live="polite"></p>
</form>


    <a href="index.html">Back to registration</a>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener(
      "submit",
      async function (event) {
        event.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const errorEl = document.getElementById("errorMsg");

        errorEl.textContent = "";

        try {
          const response = await fetch("adminb4u.json");

          if (!response.ok) {
            throw new Error("Could not load usersb4u.json");
          }

          const users = await response.json();

          const user = users.find(function (item) {
            return (
              item.username === username &&
              item.password === password
            );
          });

          if (!user) {
            errorEl.textContent = "Invalid username or password.";
            return;
          }

          // This must be on the login page, after a correct login.
          sessionStorage.setItem("b4u_loggedIn", "true");

          // This opens the protected registration list.
          window.location.href = "infob4u.html";
        } catch (error) {
          console.error(error);
          errorEl.textContent =
            "Could not log in. Check that usersb4u.json is in this folder.";
        }
      }
    );
  </script>
</body>
</html>
