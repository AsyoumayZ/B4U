<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <style>
/* Base / layout */
    html {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      color: #f0f4ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;

      background: radial-gradient(ellipse at bottom, #0b1026 0%, #020205 100%);
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background-image:
        radial-gradient(1px 1px at 10% 10%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 20% 30%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 35% 60%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 50% 20%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 65% 40%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 80% 10%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 90% 70%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 15% 80%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 45% 90%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 75% 85%, #fff, rgba(255,255,255,0));
      background-size: 200px 200px;
      background-repeat: repeat;
      opacity: 0.7;

      animation: twinkle 3s ease-in-out infinite;
    }

    body::after {
      background-image:
        radial-gradient(1.5px 1.5px at 25% 25%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 55% 35%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 85% 55%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 35% 75%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 65% 15%, #fff, rgba(255,255,255,0));
      background-size: 300px 300px;
      background-repeat: repeat;
      opacity: 0.4;

      animation: twinkle 8s ease-in-out infinite reverse;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.45;
        filter: brightness(0.9);
      }
      50% {
        opacity: 0.8;
        filter: brightness(1.2);
      }
    }
    * {
  box-sizing: border-box;
}

    }

    .chat {
      max-width: 640px;
      margin: 40px auto;
      background: white;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .identity,
    .login {
      padding: 18px;
      border-bottom: 1px solid #e3e7ef;
    }

    .identity {
      font-size: 0.9rem;
      color: #68738a;
    }

    .login label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .login input {
      width: 100%;
      padding: 0.7rem;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: white;
      font-size: 1rem;
    }

    .login {
      padding: 18px;
	 }

    .login button {
      margin-top: 12px;
      padding: 11px 16px;
      border: 0;
      border-radius: 10px;
      background: #5b5cf0;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    #loginMessage {
      margin: 10px 0 0;
      font-size: 0.85rem;
      color: #b3261e;
    }

    #messages {
      height: 400px;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 12px 14px;
      border-radius: 12px;
      background: #eef0f6;
      max-width: 85%;
      line-height: 1.5;
    }

    .meta {
      display: block;
      margin-bottom: 5px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #68738a;
    }

    form {
      display: flex;
      gap: 8px;
      padding: 14px;
      border-top: 1px solid #e3e7ef;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #d9dee7;
      border-radius: 10px;
      font: inherit;
      outline: none;
    }

    button {
      border: 0;
      padding: 0 16px;
      border-radius: 10px;
      background: #5b5cf0;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="chat">
    <div class="login" id="loginSection">
      <label for="phone">Enter your registered phone number</label>
      <input type="tel" id="phone" autocomplete="tel" required>
      <div class="buttonBack0">
      <a href="Team.html">Back</a>
      </div>
      <button id="loginButton">Start chat</button>
      <p id="loginMessage" aria-live="polite"></p>
    </div>

    <div class="identity hidden" id="identity"></div>

    <div id="messages" class="hidden"></div>

    <form id="form" class="hidden">
      <input id="input" type="text" placeholder="Type a message..." autocomplete="off" required>
      <div class="buttonBack1">
       <a href="Team.html">Back</a>
      </div>
      <button>Send</button>
    </form>
  </div>

  <script src="chat.js"></script>

</body>
</html>
