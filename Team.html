<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Baseball4United - Teams</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
 /* Base / layout */
    html {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      color: #f0f4ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;

      background: radial-gradient(ellipse at bottom, #0b1026 0%, #020205 100%);
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background-image:
        radial-gradient(1px 1px at 10% 10%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 20% 30%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 35% 60%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 50% 20%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 65% 40%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 80% 10%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 90% 70%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 15% 80%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 45% 90%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 75% 85%, #fff, rgba(255,255,255,0));
      background-size: 200px 200px;
      background-repeat: repeat;
      opacity: 0.7;

      animation: twinkle 3s ease-in-out infinite;
    }

    body::after {
      background-image:
        radial-gradient(1.5px 1.5px at 25% 25%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 55% 35%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 85% 55%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 35% 75%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 65% 15%, #fff, rgba(255,255,255,0));
      background-size: 300px 300px;
      background-repeat: repeat;
      opacity: 0.4;

      animation: twinkle 8s ease-in-out infinite reverse;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.45;
        filter: brightness(0.9);
      }
      50% {
        opacity: 0.8;
        filter: brightness(1.2);
      }
    }

    * {
      box-sizing: border-box;
    }

    header {
      padding: 2rem 1rem;
      text-align: center;
      background: rgba(0, 0, 0, 0.55);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    h1 {
      margin: 0;
    }

    main {
      width: min(900px, calc(100% - 2rem));
      margin: 2rem auto;
    }

    .teams-box {
      text-align: center;
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.55);
    }

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.25rem;
      margin-top: 1.5rem;
    }

    .team {
      min-height: 280px;
      padding: 1.25rem;
      border-radius: 10px;
    }

    .blue-team {
      border: 1px solid rgba(83, 132, 255, 0.7);
      background: rgba(48, 94, 220, 0.2);
    }

    .red-team {
      border: 1px solid rgba(255, 86, 86, 0.7);
      background: rgba(210, 48, 48, 0.2);
    }

    .team h2 {
      margin: 0 0 1rem;
      text-align: center;
    }

    .blue-team h2 {
      color: #8eb1ff;
    }

    .red-team h2 {
      color: #ff9696;
    }

    .team ul {
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .team li {
      margin-top: 0.6rem;
      padding: 0.75rem;
      border-radius: 6px;
      color: white;
      background: rgba(255, 255, 255, 0.1);
    }

    .empty-message {
      color: #cfd6ff;
      text-align: center;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    button,
    a {
      border: none;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      color: white;
      background: linear-gradient(135deg, #4f6dff, #8a5cff);
      text-decoration: none;
      font: inherit;
      cursor: pointer;
    }

    button:hover,
    a:hover {
      filter: brightness(1.12);
    }

    @media (max-width: 600px) {
      .teams-grid {
        grid-template-columns: 1fr;
      }
    }
footer {
      position: relative;
      z-index: 1;
      margin-top: auto;
      padding: 1rem;
      color: #cfd6ff;
      text-align: center;
    }

  </style>
</head>

<body>
  <header>
    <h1>Welcome to a match today</h1>
  </header>

  <main>
    <section class="teams-box">
      <p>
        Ready to hit and catch youngsters!
      </p>

      <div class="teams-grid">
        <section class="team blue-team">
          <h2>Blue Team</h2>
          <ul id="blueTeamList"></ul>
        </section>

        <section class="team red-team">
          <h2>Red Team</h2>
          <ul id="redTeamList"></ul>
        </section>
      </div>

      <div class="buttons">
        <a href="index.html">Registration page</a>
        <a href="login.html">Admin registrations</a>
      </div>
    </section>
  </main>
<footer>
    Hit the ball and run for your joy before someone catches you.
  </footer>
  <script src="team.js"></script>
</body>
</html>
